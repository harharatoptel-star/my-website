<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>خدماتنا - مؤسسة عبدالحافظ هرهرة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background: url('project3.jpg') no-repeat center fixed;
      background-size: cover;
      min-height: 100vh;
      color: white;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 31, 68, 0.75);
      z-index: -1;
    }
    
    header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    
    header h1 {
      font-size: 32px;
      color: #f5c542;
      margin-bottom: 30px;
    }
    
    .services {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    
    .service-card {
      background: rgba(0,0,0,0.3);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #f5c542;
      text-align: center;
    }
    
    .service-card .icon {
      font-size: 40px;
      margin-bottom: 15px;
    }
    
    .service-card h3 {
      color: #f5c542;
      margin-bottom: 10px;
    }
    
    .back-btn {
      display: inline-block;
      margin: 40px auto;
      padding: 12px 25px;
      background: #f5c542;
      color: #0a1f44;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }
    
    .back-btn:hover {
      transform: translateY(-3px);
    }
    
    .center {
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>خدماتنا</h1>
  </header>

  <div class="services">
    <div class="service-card">
      <div class="icon">⚡</div>
      <h3>الطاقة الشمسية</h3>
      <p>تصميم وتركيب أنظمة الطاقة الشمسية للمشاريع السكنية والتجارية</p>
    </div>
    
    <div class="service-card">
      <div class="icon">🔥</div>
      <h3>أنظمة مكافحة الحرائق</h3>
      <p>توريد وتركيب وصيانة أنظمة إنذار ومكافحة الحرائق</p>
    </div>
    
    <div class="service-card">
      <div class="icon">📹</div>
      <h3>أنظمة المراقبة</h3>
      <p>تركيب كاميرات المراقبة وأنظمة التحكم الأمني</p>
    </div>
  </div>

  <div class="center">
    <a href="index.html" class="back-btn">العودة للرئيسية</a>
  </div>

</body>
</html>
