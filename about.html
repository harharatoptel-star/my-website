<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>من نحن - مؤسسة عبدالحافظ هرهرة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: #0a1f44;
      color: white;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }
    
    .poster-img {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .back-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 25px;
      background: #f5c542;
      color: #0a1f44;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 100;
    }
    
    .back-btn:hover {
      transform: translateY(-3px);
      background: #ffd766;
    }
    
    @media (max-width: 768px) {
      .back-btn {
        top: 15px;
        right: 15px;
        padding: 10px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">العودة للرئيسية</a>

  <div class="container">
    <img src="about-poster.jpg" alt="من نحن - مؤسسة عبدالحافظ هرهرة" class="poster-img">
  </div>

</body>
</html>
