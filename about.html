<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>من نحن - مؤسسة عبدالحافظ هرهرة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background: url('project2.jpg') no-repeat center fixed;
      background-size: cover;
      min-height: 100vh;
      color: white;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 31, 68, 0.75);
      z-index: -1;
    }
    
    .back-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 25px;
      background: #f5c542;
      color: #0a1f44;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10;
    }
    
    .back-btn:hover {
      transform: translateY(-3px);
      background: #ffd766;
    }
    
    @media (max-width: 768px) {
      .back-btn {
        top: 15px;
        right: 15px;
        padding: 10px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">العودة للرئيسية</a>

</body>
</html>
