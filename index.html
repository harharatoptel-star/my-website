<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: #0a1f44;
      color: white;
      overflow-x: hidden;
    }
    
    /* الشريط الجانبي العمودي */
    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 90px;
      background: rgba(10, 31, 68, 0.85);
      backdrop-filter: blur(15px);
      border-left: 1px solid rgba(245, 197, 66, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 0;
      gap: 25px;
      z-index: 100;
      transition: width 0.3s ease;
    }
    
    .sidebar:hover {
      width: 220px;
    }
    
    .sidebar-item {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(245, 197, 66, 0.1);
      border: 1px solid rgba(245, 197, 66, 0.3);
      border-radius: 14px;
      text-decoration: none;
      color: white;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    
    .sidebar-item:hover {
      background: #f5c542;
      border-color: #f5c542;
      transform: translateX(-5px);
      box-shadow: 0 5px 20px rgba(245, 197, 66, 0.4);
    }
    
    .sidebar-item .icon {
      width: 28px;
      height: 28px;
      fill: #f5c542;
      transition: all 0.3s;
    }
    
    .sidebar-item:hover .icon {
      fill: #0a1f44;
    }
    
    .sidebar-item .label {
      position: absolute;
      right: 70px;
      white-space: nowrap;
      font-weight: 700;
      font-size: 15px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .sidebar:hover .label {
      opacity: 1;
    }
    
    /* حاوية الصورة الرئيسية */
    .hero-container {
      width: 100%;
      height: 100vh;
      padding-right: 90px;
      position: relative;
    }
    
    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    
    /* تأثير التظليل على الصورة عشان النص يبان */
    .hero-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(10,31,68,0.3) 0%, rgba(10,31,68,0.8) 100%);
      pointer-events: none;
    }
    
    /* للجوال */
    @media (max-width: 768px) {
      .sidebar {
        bottom: 0;
        top: auto;
        right: 0;
        left: 0;
        width: 100%;
        height: 70px;
        flex-direction: row;
        padding: 0 10px;
        gap: 10px;
        overflow-x: auto;
      }
      
      .sidebar:hover {
        width: 100%;
      }
      
      .sidebar-item {
        min-width: 55px;
        height: 55px;
      }
      
      .sidebar-item .label {
        display: none;
      }
      
      .hero-container {
        padding-right: 0;
        padding-bottom: 70px;
      }
    }
  </style>
</head>
