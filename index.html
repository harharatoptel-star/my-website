  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(180deg, #0a1f44 0%, #0f2a5c 100%);
      color: white;
      min-height: 100vh;
    }
    
    header {
      text-align: center;
      padding: 50px 20px 30px;
      position: relative;
    }
    
    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #f5c542, transparent);
    }
    
    header h1 {
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(135deg, #f5c542 0%, #ffd766 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
      letter-spacing: -0.5px;
    }
    
    header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      font-weight: 400;
    }
    
    nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      padding: 30px 30px 50px;
      max-width: 1300px;
      margin: 0 auto;
    }
    
    .nav-item {
      background: rgba(245, 197, 66, 0.08);
      border: 1px solid rgba(245, 197, 66, 0.3);
      border-radius: 16px;
      padding: 25px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-decoration: none;
      color: white;
      position: relative;
      overflow: hidden;
    }
    
    .nav-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(245, 197, 66, 0.2), transparent);
      transition: left 0.6s;
    }
    
    .nav-item:hover::before {
      left: 100%;
    }
    
    .nav-item:hover {
      background: rgba(245, 197, 66, 0.18);
      border-color: #f5c542;
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 12px 30px rgba(245, 197, 66, 0.25);
    }
    
    .nav-item .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5c542 0%, #d4a017 100%);
      border-radius: 14px;
      transition: all 0.3s;
    }
    
    .nav-item:hover .icon {
      transform: rotateY(180deg);
      box-shadow: 0 0 20px rgba(245, 197, 66, 0.6);
    }
    
    .nav-item .icon svg {
      width: 26px;
      height: 26px;
      fill: #0a1f44;
    }
    
    .nav-item span {
      font-size: 17px;
      font-weight: 700;
      display: block;
      letter-spacing: 0.3px;
    }
    
    .poster-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 30px 60px;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    
    @media (max-width: 768px) {
      header h1 {
        font-size: 26px;
      }
      nav {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 20px 20px 40px;
      }
      .nav-item {
        padding: 18px 15px;
      }
      .nav-item .icon {
        width: 42px;
        height: 42px;
      }
      .nav-item span {
        font-size: 15px;
      }
    }
    
    @media (max-width: 480px) {
      nav {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
