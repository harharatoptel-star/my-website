  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background: #0a1f44;
      color: white;
    }
    
    header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    
    header h1 {
      font-size: 32px;
      color: #f5c542;
      margin-bottom: 10px;
    }
    
    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .nav-item {
      background: rgba(245, 197, 66, 0.15);
      border: 2px solid #f5c542;
      border-radius: 12px;
      padding: 15px 25px;
      min-width: 140px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(5px);
      text-decoration: none;
      color: white;
      display: block;
    }
    
    .nav-item:hover {
      background: #f5c542;
      color: #0a1f44;
      transform: translateY(-5px);
    }
    
    .nav-item .icon {
      font-size: 28px;
      display: block;
      margin-bottom: 8px;
    }
    
    .nav-item span {
      font-size: 16px;
      font-weight: bold;
    }

    .poster-container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }
    
    @media (max-width: 768px) {
      header h1 {
        font-size: 24px;
      }
      .nav-item {
        min-width: 120px;
        padding: 12px 20px;
      }
    }
  </style>
</head>
